            unbind C-b
            set -g prefix C-a
            set -sg escape-time 1
            set -g base-index 1
            setw -g pane-base-index 1

            bind r source-file ~/.tmux.conf \; display "Reloaded!"

            bind C-a send-prefix
            bind | split-window -h
            bind - split-window -v

            bind -r C-h select-window -t :-
            bind -r C-l select-window -t :+

            bind -r H resize-pane -L 5
            bind -r J resize-pane -D 5
            bind -r K resize-pane -U 5
            bind -r L resize-pane -R 5

            set -g repeat-time 1000

            # ============================================
            # vim-tmux-navigator
            # Бесшовная навигация между панелями tmux и
            # сплитами neovim по Ctrl-h/j/k/l без префикса
            # ============================================
            is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
                | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
            bind-key h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
            bind-key j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
            bind-key k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
            bind-key l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
            # ============================================

            setw -g mouse off
            # set -g mouse-select-pane off
            # set -g mouse-resize-pane off
            # set -g mouse-select-window off

            set -g status-style fg=white
            set -g status-style bg=black
            set -g status-style bright

            # Changing the Window List Colors
            setw -g window-status-style fg=cyan
            setw -g window-status-style bg=default
            setw -g window-status-style dim

            setw -g window-status-current-style fg=white
            setw -g window-status-current-style bg=red
            setw -g window-status-current-style bright

            set -g pane-border-style fg=white
            set -g pane-border-style bg=black

            set -g pane-active-border-style fg=white
            set -g pane-active-border-style bg=yellow

            # Customizing the Command Line
            set -g message-style fg=white
            set -g message-style bg=black
            set -g message-style bright

            # Customizing the Status Bar
            # Configuring Status Bar Items
            # set -g status-left "#[fg=green]#S"
            # set -g status-left "#[fg=green]#S #[fg=yellow]#I #[fg=cyan]#P"
            set -g status-left-length 40
            set -g status-left "#[fg=green]#S:#[fg=yellow]#I.#[fg=cyan]#P"
            set -g status-right "#[fg=cyan]%d %b %R"

            # Keeping Status Bar Info Up to Date
            set -g status-interval 60

            # Centering the Window List
            set -g status-justify centre

            # Identifying Activity in Other Windows
            setw -g monitor-activity on
            set -g visual-activity on

            setw -g pane-border-lines single

            setw -g mode-keys vi

            # set -s copy-command 'wl-copy'
            bind C-c run "tmux save-buffer - | wl-copy"
            bind C-v run "tmux set-buffer \"$(wl-paste)\"; tmux paste-buffer"

            # Remapping Copy and Paste Keys
            unbind [
            bind Escape copy-mode
            unbind p
            bind p paste-buffer
            # bind -t vi-copy 'v' begin-selection
            # bind -t vi-copy 'y' copy-selection
            bind-key -Tcopy-mode-vi v send -X begin-selection
            bind-key -Tcopy-mode-vi y send -X copy-selection

            # To enable Yazi's image preview to work correctly in tmux
            set -g allow-passthrough on
            set -ga update-environment TERM
            set -ga update-environment TERM_PROGRAM
